<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 872" width="1200" height="872" role="img" aria-labelledby="t d">
  <title id="t">hapax: subtract the known, assemble what survives, score the rest as a distance</title>
  <desc id="d">One library enters. A cascade of cheapest-index-first references removes 77.10 percent of read pairs as already known; 22.90 percent survives. What survives splits into contigs nothing can name at median depth 6 and reads that never assembled at median depth 1. Everything, removed or not, is placed on one distance axis with its nearest-relative identity and a shuffled null beside it. The tool ships a cost-versus-completeness curve and the residue, and emits no novelty score, no threat score and no per-read verdict.</desc>

  <defs>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .ttl { font: 700 40px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f1f5f9; }
      .sub { font: 400 19px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .step { font: 700 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; letter-spacing: 2.2px; }
      .h { font: 700 21px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f1f5f9; }
      .n { font: 700 26px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f1f5f9; }
      .b { font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #cbd5e1; }
      .m { font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8495ad; }
      .pill { font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #cbd5e1; }
      .card { fill: #141b2b; stroke: #26314a; }
    </style>
  </defs>

  <rect width="1200" height="872" rx="18" fill="#0b1018"/>

  <!-- masthead -->
  <text class="ttl" x="56" y="74">hapax</text>
  <text class="sub" x="200" y="73">wastewater in, a measurement out</text>
  <text class="m" x="56" y="101">Every number here is measured on SRR23973193 across 5 seeds, from a committed script and a seed. No sample is assumed to be known.</text>

  <!-- ===== 1. the library ===== -->
  <text class="step" x="56" y="150">1 · ONE LIBRARY, MATES MERGED FIRST</text>
  <rect x="56" y="164" width="1088" height="40" rx="8" fill="#101827" stroke="#26314a"/>
  <circle cx="80" cy="184" r="5" fill="#38bdf8"/>
  <text class="b" x="96" y="189">8,731,224 pairs · 35.1% of them merge into one read · recognition at 20% divergence rises 10.5% &#8594; 38.4% for free</text>

  <!-- ===== 2. subtract the known ===== -->
  <text class="step" x="56" y="252">2 &#183; SUBTRACT THE KNOWN</text>
  <text class="m" x="1144" y="252" text-anchor="end">cheapest index first &#183; percentages are of read pairs</text>
  <g>
    <!-- 10 px per 1% of read pairs -->
    <rect x="56" y="268" width="3.1" height="54" fill="#1e293b"/>
    <rect x="59.1" y="268" width="379.3" height="54" fill="#0ea5e9"/>
    <rect x="438.4" y="268" width="52.1" height="54" fill="#22d3ee"/>
    <rect x="490.5" y="268" width="6.9" height="54" fill="#2dd4bf"/>
    <rect x="497.4" y="268" width="10.0" height="54" fill="#34d399"/>
    <rect x="507.4" y="268" width="303.3" height="54" fill="#6366f1"/>
    <rect x="810.7" y="268" width="14.3" height="54" fill="#a78bfa"/>
    <rect x="825.0" y="268" width="2.0" height="54" fill="#c084fc"/>
    <rect x="827.0" y="268" width="229.0" height="54" fill="#f59e0b"/>
    <rect x="1056" y="268" width="88" height="54" fill="#111a2b" stroke="#26314a"/>
    <text class="m" x="1100" y="300" text-anchor="middle">cost curve</text>
    <text class="m" x="1100" y="314" text-anchor="middle">not flat yet</text>
    <rect x="56" y="268" width="1000" height="54" fill="none" stroke="#26314a" rx="2"/>

    <!-- callouts -->
    <path d="M248 322 L248 342" stroke="#0ea5e9" stroke-width="1.5"/>
    <text class="b" x="248" y="358" text-anchor="middle" fill="#7dd3fc">SILVA rRNA, 0.27 GB &#8594; 37.93 pts</text>
    <path d="M659 268 L659 250" stroke="#6366f1" stroke-width="1.5"/>
    <text class="b" x="659" y="243" text-anchor="middle" fill="#a5b4fc">the sample's own contigs, 0.015 GB &#8594; 30.33 pts</text>
    <text class="m" x="659" y="225" text-anchor="middle">efficiency, never sensitivity: 0.0% of a genuinely novel genome</text>

    <text class="n" x="56" y="412">77.10%</text>
    <text class="b" x="160" y="411">removed as already known <tspan class="m">(77.02&#8211;77.28, 5 seeds) — a lower bound on "known"</tspan></text>
    <text class="n" x="941" y="412" text-anchor="end" fill="#fbbf24">22.90%</text>
    <text class="b" x="951" y="411">survives</text>
  </g>

  <!-- ===== 3. what survives ===== -->
  <text class="step" x="56" y="462">3 · WHAT SURVIVES, SPLIT BY WHETHER IT ASSEMBLED</text>
  <g>
    <rect class="card" x="56" y="478" width="340" height="128" rx="12"/>
    <rect x="56" y="478" width="340" height="4" rx="2" fill="#f59e0b"/>
    <text class="h" x="80" y="514">assembled, unnameable</text>
    <text class="b" x="80" y="542">&#8776;8.4 points · 46,157 contigs</text>
    <text class="m" x="80" y="564">median depth 6; 3.87% clear 500 nt and 2&#215;</text>
    <text class="m" x="80" y="584">17.6% share no 31-mer with four continents</text>

    <rect class="card" x="420" y="478" width="340" height="128" rx="12"/>
    <rect x="420" y="478" width="340" height="4" rx="2" fill="#fb7185"/>
    <text class="h" x="444" y="514">never assembled</text>
    <text class="b" x="444" y="542">&#8776;11.1 points · <tspan fill="#fda4af">median depth 1</tspan></text>
    <text class="m" x="444" y="564">a measured boundary, not a discovery pile:</text>
    <text class="m" x="444" y="584">read length and database reach land here too</text>

    <rect class="card" x="784" y="478" width="360" height="128" rx="12"/>
    <rect x="784" y="478" width="360" height="4" rx="2" fill="#34d399"/>
    <text class="h" x="808" y="514">other plants as background</text>
    <text class="b" x="808" y="542">512 libraries remove 87.5%, still falling</text>
    <text class="m" x="808" y="564">at depth 1: residue 79.0% survives against</text>
    <text class="m" x="808" y="584">70.5% identified — blind to anything seen once</text>
  </g>

  <!-- ===== 4. one distance axis ===== -->
  <text class="step" x="56" y="656">4 · SCORE EVERYTHING, REMOVED OR NOT, ON ONE DISTANCE AXIS</text>
  <g>
    <rect x="56" y="672" width="1088" height="6" rx="3" fill="url(#axis)"/>
    <g fill="#e2e8f3">
      <rect x="150" y="662" width="2" height="26" opacity="0.75"/><rect x="186" y="662" width="2" height="26" opacity="0.75"/>
      <rect x="201" y="662" width="2" height="26" opacity="0.75"/><rect x="263" y="662" width="2" height="26" opacity="0.75"/>
      <rect x="318" y="662" width="2" height="26" opacity="0.75"/><rect x="331" y="662" width="2" height="26" opacity="0.75"/>
      <rect x="402" y="662" width="2" height="26" opacity="0.75"/><rect x="455" y="662" width="2" height="26" opacity="0.75"/>
      <rect x="470" y="662" width="2" height="26" opacity="0.75"/><rect x="498" y="662" width="2" height="26" opacity="0.75"/>
      <rect x="560" y="662" width="2" height="26" opacity="0.75"/><rect x="604" y="662" width="2" height="26" opacity="0.75"/>
      <rect x="648" y="662" width="2" height="26" opacity="0.75"/><rect x="700" y="662" width="2" height="26" opacity="0.75"/>
      <rect x="742" y="662" width="2" height="26" opacity="0.75"/><rect x="790" y="662" width="2" height="26" opacity="0.75"/>
      <rect x="836" y="662" width="2" height="26" opacity="0.75"/><rect x="905" y="662" width="2" height="26" opacity="0.75"/>
      <rect x="960" y="662" width="2" height="26" opacity="0.75"/><rect x="1020" y="662" width="2" height="26" opacity="0.75"/>
    </g>
    <text class="m" x="56" y="708">far from anything published</text>
    <text class="m" x="1144" y="708" text-anchor="end">matched</text>
    <text class="b" x="600" y="716" text-anchor="middle">one mark per contig, un-thresholded, each row carrying its nearest-relative identity, coverage and E-value</text>
    <text class="m" x="600" y="736" text-anchor="middle">a shuffled null beside every field (0.00% on this axis) · &#8220;cannot discriminate here&#8221; is a legitimate row</text>
  </g>

  <!-- ===== what it refuses to emit ===== -->
  <g>
    <text class="step" x="56" y="774">AND THESE IT WILL NOT EMIT</text>
    <g>
      <rect x="56" y="786" width="190" height="28" rx="14" fill="#1b1220" stroke="#5b2745"/>
      <text class="pill" x="151" y="805" text-anchor="middle" fill="#fda4af">no novelty score</text>
      <rect x="266" y="786" width="190" height="28" rx="14" fill="#1b1220" stroke="#5b2745"/>
      <text class="pill" x="361" y="805" text-anchor="middle" fill="#fda4af">no threat score</text>
      <rect x="476" y="786" width="214" height="28" rx="14" fill="#1b1220" stroke="#5b2745"/>
      <text class="pill" x="583" y="805" text-anchor="middle" fill="#fda4af">no per-read verdict</text>
      <rect x="710" y="786" width="218" height="28" rx="14" fill="#1b1220" stroke="#5b2745"/>
      <text class="pill" x="819" y="805" text-anchor="middle" fill="#fda4af">no &#8220;matches nothing&#8221;</text>
    </g>
    <text class="m" x="56" y="845">A search can say whether something is already known; it cannot say that something is new. Declared blind spots ship as part of the output.</text>
  </g>
</svg>
