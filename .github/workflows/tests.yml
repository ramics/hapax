# A fresh container, every push: the only way to know the suite runs green without someone
# already knowing what to install. Needs no external tool or index (see TOOLS.md); the
# end-to-end job (end_to_end.yml) is the half that does.
name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      # Installed, not just on the path: `hapax` is a package since PLAN.md step 3, and
      # the suite imports it. Editable so the checkout is what runs, and so a test that
      # reads a committed file beside the package still finds it.
      - run: python -m pip install -e .
      - run: python -m pytest
