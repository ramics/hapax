# A fresh container, every push: the only way to know the suite runs green without someone
# already knowing what to install. Needs no external tool or index (see TOOLS.md).
name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
