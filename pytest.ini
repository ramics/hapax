[pytest]
# The root suite is tests/. Without this, a bare `pytest` from the repo root also collects
# experiments/codon_assembler/python/tests, which import the archive's `python` package and
# only run from that directory (see TOOLS.md), so a fresh container saw two collection
# errors before any test ran.
testpaths = tests
# Print every skip with its reason. A skip is a claim that something was not tested; it
# should never be invisible in the summary line.
addopts = -rs
